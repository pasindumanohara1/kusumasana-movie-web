    <style>
      /* Logo Preloader Styles */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0a0a1a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .logo-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .animating-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
        animation: logoPulse 1.8s infinite ease-in-out;
        z-index: 2;
      }

      .loading-ring {
        position: absolute;
        width: 155px;
        height: 155px;
        border: 3px solid rgba(59, 130, 246, 0.15);
        border-top: 3px solid #ffd700;
        border-right: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spinRing 1.2s linear infinite;
      }

      .preloader-title {
        margin-top: 24px;
        font-family: 'Noto Sans Sinhala', 'Montserrat', sans-serif;
        color: #e2e8f0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      @keyframes logoPulse {
        0% { transform: scale(0.95); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4)); }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 22px rgba(59, 130, 246, 0.8)); }
        100% { transform: scale(0.95); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4)); }
      }

      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <script>
      // Automatically hide preloader when page assets load
      window.addEventListener('load', () => {
        const loader = document.getElementById('preloader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.visibility = 'hidden';
            loader.style.display = 'none';
          }, 500);
        }
      });
      // Fallback timeout in case some external media delays window.load
      setTimeout(() => {
        const loader = document.getElementById('preloader');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.visibility = 'hidden';
            loader.style.display = 'none';
          }, 500);
        }
      }, 1800);
    </script>
